[package]
name = "rdf-rust"
version = "0.3.0"
edition = "2021"
description = "Fast partial and total radial distribution functions, with native support for partially occupied crystal structures"
license = "MIT"
readme = "README.md"

[lib]
name = "rdfrust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
numpy = "0.23"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# panic=abort is incompatible with `cargo test`, and PyO3 needs unwinding anyway
